name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke build check
    runs-on: ubuntu-24.04
    env:
      BUILD_SUITE: smoke
    steps: &build_steps
      - uses: actions/checkout@v6
        with:
          path: Sota
          submodules: true
          persist-credentials: false

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons doctest-dev g++-mingw-w64-x86-64-posix \
            libasound2-dev libdbus-1-dev libdecor-0-dev libfontconfig1-dev libgl1-mesa-dev \
            libpulse-dev libudev-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxkbcommon-dev libxrandr-dev libvulkan-dev \
            wine wine64 xvfb xauth
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;23.2.8568313'

      - name: Run the standalone C++ smoke test
        if: env.BUILD_SUITE == 'smoke'
        working-directory: Sota
        run: |
          g++ -std=c++20 tests/standalone/arithmetic_test.cpp -o "$RUNNER_TEMP/sota-arithmetic-test"
          "$RUNNER_TEMP/sota-arithmetic-test"

      - name: Prepare Godot 4.4
        run: |
          godot_source="$RUNNER_TEMP/godot-source"
          git clone --depth 1 --branch 4.4-stable https://github.com/godotengine/godot.git "$godot_source"
          echo "GODOT_SOURCE=$godot_source" >> "$GITHUB_ENV"

          godot_binaries="$RUNNER_TEMP/godot-binaries"
          mkdir -p "$godot_binaries"
          cd "$godot_binaries"
          release=https://github.com/godotengine/godot-builds/releases/download/4.4-stable
          curl -fsSL --retry 3 "$release/Godot_v4.4-stable_export_templates.tpz" -o templates.tpz
          templates=(templates/linux_debug.x86_64 'templates/windows_debug_x86_64*.exe')
          if [[ "$BUILD_SUITE" == full ]]; then
            templates+=(templates/linux_release.x86_64 'templates/windows_release_x86_64*.exe')
            for editor in Godot_v4.4-stable_linux.x86_64.zip Godot_v4.4-stable_win64.exe.zip; do
              curl -fsSL --retry 3 "$release/$editor" -o "$editor"
              unzip -qj "$editor"
            done
            chmod +x Godot_v4.4-stable_linux.x86_64
          fi
          unzip -qj templates.tpz "${templates[@]}"
          chmod +x linux_*.x86_64
          unlink templates.tpz
          echo "GODOT_BINARIES=$godot_binaries" >> "$GITHUB_ENV"

      - name: Build and test Sota
        working-directory: Sota
        env:
          WINEDEBUG: '-all'
          WINEPREFIX: ${{ runner.temp }}/sota-wine
        run: |
          status=0
          for platform in linux windows android; do
            xvfb-run -a python3 scripts/test-builds.py --suite "$BUILD_SUITE" \
              --platform "$platform" -j "$(nproc)" || status=1
            # Each target has its own object files. Reclaim disk space between platforms
            # in the disposable CI checkouts.
            git -C "$GODOT_SOURCE" clean -ffdx
            git -C godot-cpp clean -ffdx
          done
          exit "$status"

  full:
    name: Full build check
    if: contains(github.event.pull_request.labels.*.name, 'full-build')
    runs-on: ubuntu-24.04
    env:
      BUILD_SUITE: full
    steps: *build_steps
